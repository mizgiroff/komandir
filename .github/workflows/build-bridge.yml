name: Build KomandirBridge Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack latest Komandir zip if present
        id: prep
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "komandir_v*.zip" |
            Sort-Object { if ($_.Name -match '_v(\d+)') { [int]$matches[1] } else { 0 } } |
            Select-Object -Last 1
          if ($zip) {
            if (Test-Path src_bridge) { Remove-Item -Recurse -Force src_bridge }
            Expand-Archive -Path $zip.FullName -DestinationPath src_bridge -Force
            $b = Get-ChildItem -Path src_bridge -Recurse -Directory -Filter "bridge" | Select-Object -First 1
            $g = Get-ChildItem -Path src_bridge -Recurse -File -Filter "build.gradle.kts" | Where-Object { $_.FullName -match 'app[\\/]build\.gradle\.kts$' } | Select-Object -First 1
            if ($g) {
              $ver = (Get-Content $g.FullName | Select-String 'versionName\s*=\s*"([^"]+)"').Matches.Groups[1].Value
              echo "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
            if ($b) {
              echo "bridgedir=$($b.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else { exit 1 }
          } elseif (Test-Path bridge) {
            echo "bridgedir=bridge" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else { exit 1 }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build KomandirBridge.exe
        working-directory: ${{ steps.prep.outputs.bridgedir }}
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o KomandirBridge.exe .

      - name: Upload KomandirBridge.exe
        uses: actions/upload-artifact@v4
        with:
          name: KomandirBridge_exe
          path: ${{ steps.prep.outputs.bridgedir }}/KomandirBridge.exe
          if-no-files-found: error

      - name: Attach KomandirBridge.exe to GitHub Release
        if: steps.prep.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          files: ${{ steps.prep.outputs.bridgedir }}/KomandirBridge.exe
