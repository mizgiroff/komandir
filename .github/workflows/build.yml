name: Build Komandir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or unpack project
        id: proj
        run: |
          LATEST_ZIP=$(ls -v [Kk]omandir_v*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Unpacking $LATEST_ZIP into src_build"
            rm -rf src_build
            mkdir -p src_build
            unzip -q "$LATEST_ZIP" -d src_build
            WORKDIR="src_build"
          else
            WORKDIR="."
          fi
          VERSION=$(grep 'versionName' "$WORKDIR/app/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using workdir=$WORKDIR, version=$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: gradle test

      - name: Build Debug APK
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: gradle assembleDebug

      - name: Prepare versioned APK
        run: |
          cp "${{ steps.proj.outputs.workdir }}/app/build/outputs/apk/debug/app-debug.apk" "komandir_v${{ steps.proj.outputs.version }}.apk"
          ls -lh "komandir_v${{ steps.proj.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: komandir_v${{ steps.proj.outputs.version }}
          path: komandir_v${{ steps.proj.outputs.version }}.apk
          retention-days: 3
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.proj.outputs.version }}
          name: Komandir v${{ steps.proj.outputs.version }}
          body: |
            Komandir v${{ steps.proj.outputs.version }} by mizgiroff.
            - Local storage, Google Drive, Web Drives (WebDAV/Cloud), and LAN shares (SMB/FTP/SFTP)
            - 1-pane & 2-pane Commander mode
            - Light / Dark / System themes & RU / UA / EN interface
          files: komandir_v${{ steps.proj.outputs.version }}.apk
